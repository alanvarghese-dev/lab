name: Automated Release Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "automated-release-pipeline/**"
      - ".github/workflows/automated-release.yml"

  pull_request:
    branches:
      - main
    paths:
      - "automated-release-pipeline/**"
      - ".github/workflows/automated-release.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: automated-release-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mise
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Install project tools
        run: mise install

      - name: Run Ruff
        run: mise exec -- ruff check .

      - name: Run tests
        run: mise exec -- pytest

      - name: Build release artifact
        run: |
          mkdir -p dist
          tar -czf dist/automated-release-pipeline.tar.gz \
            app.py \
            mise.toml \
            pytest.ini

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: automated-release-pipeline
          path: automated-release-pipeline/dist/automated-release-pipeline.tar.gz
