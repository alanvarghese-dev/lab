apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-deployment
  template:
    metadata:
      labels:
        app: kubernetes-deployment
    spec:
      containers:
        - name: app
          image: kubernetes-deployment:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
